<script>
        (() => {
            const speichername = "felix-harren-theme";
            let gespeichertesDesign = null;

            try {
                gespeichertesDesign = localStorage.getItem(speichername);
            } catch (fehler) {
                gespeichertesDesign = null;
            }

            const systemIstDunkel = window.matchMedia(
                "(prefers-color-scheme: dark)"
            ).matches;

            const startDesign =
                gespeichertesDesign === "dark" ||
                gespeichertesDesign === "light"
                    ? gespeichertesDesign
                    : systemIstDunkel
                        ? "dark"
                        : "light";

            document.documentElement.dataset.theme = startDesign;
        })();
    </script>
